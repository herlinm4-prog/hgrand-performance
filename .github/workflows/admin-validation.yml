name: H Grand Admin validation
on:
  push:
    branches: [codex/hgrand-alertas]
  pull_request:
    paths: ['site/**', '.github/workflows/admin-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:admin
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_CF_FETCH_ENABLED: 'false'
